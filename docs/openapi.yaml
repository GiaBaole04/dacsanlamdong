openapi: 3.0.3
info:
  title: API Đặc Sản Lâm Đồng
  version: 1.0.0
  description: 'API của website bán đặc sản Lâm Đồng (Next.js + MariaDB).


    **Xác thực:** đăng nhập bằng `POST /api/auth/login`; máy chủ đặt cookie `session_token` (JWT, httpOnly). Trình
    duyệt/Postman tự gửi lại cookie này.


    **3 vai trò:** `customer` (khách), `staff` (nhân viên), `admin`. Vai trò luôn được kiểm tra lại từ database
    ở mỗi request.


    **Quy ước lỗi:** mọi lỗi đều là JSON `{ "error": "thông báo tiếng Việt" }` với mã HTTP phù hợp (400 dữ liệu
    sai, 401 chưa đăng nhập, 403 không đủ quyền, 404 không có, 409 xung đột nghiệp vụ, 429 quá nhiều lần thử, 500
    lỗi máy chủ). Lỗi 500 luôn là câu chung chung, không lộ chi tiết kỹ thuật.'
servers:
- url: http://localhost:3000
  description: Chạy local (npm run dev)
tags:
- name: Công khai
  description: 'Không cần đăng nhập: sản phẩm, câu chuyện, chatbot'
- name: Xác thực
  description: Đăng nhập, đăng ký (OTP email), quên mật khẩu
- name: Giỏ hàng
  description: Giỏ hàng của người đăng nhập
- name: Đơn hàng (khách)
  description: Đặt hàng, xem và hủy đơn của chính mình
- name: 'Quản trị: thống kê'
  description: Trang Tổng quan (nhân viên + admin)
- name: 'Quản trị: đơn hàng'
  description: Xử lý đơn hàng (nhân viên + admin)
- name: 'Quản trị: sản phẩm'
  description: Quản lý sản phẩm (xóa chỉ admin)
- name: 'Quản trị: câu chuyện'
  description: Quản lý bài viết (xóa chỉ admin)
- name: 'Quản trị: tải ảnh'
  description: Tải ảnh lên
- name: 'Quản trị: tài khoản'
  description: Quản lý tài khoản (chỉ admin)
paths:
  /api/products:
    get:
      tags:
      - Công khai
      summary: Danh sách sản phẩm
      description: 'Trả về mọi sản phẩm đang bán kèm các quy cách (giá, tồn kho). Lưu ý `price` là chuỗi số thập
        phân.


        **Quyền truy cập:** Công khai'
      responses:
        '200':
          description: Danh sách sản phẩm
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: &id002
                      type: integer
                    name: &id001
                      type: string
                    description: *id001
                    region: *id001
                    image_note: *id001
                    image_url: *id001
                    category: *id001
                    variants:
                      type: array
                      items:
                        type: object
                        properties:
                          id: *id002
                          product_id: *id002
                          variant_name: *id001
                          price:
                            type: string
                            description: Chuỗi số thập phân, ví dụ "120000.00"
                          stock: *id002
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/Error'
  /api/products/{id}/also-bought:
    get:
      tags:
      - Công khai
      summary: Sản phẩm thường mua cùng
      description: 'Gợi ý "khách mua sản phẩm này cũng mua" dựa trên luật kết hợp từ lịch sử đơn hàng.


        **Quyền truy cập:** Công khai'
      parameters:
      - name: id
        in: path
        required: true
        description: Mã sản phẩm
        schema: *id002
      responses:
        '200':
          description: Gợi ý
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrders: *id002
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: *id002
                        ordersTogether: *id002
                        confidence: &id008
                          type: number
        '400':
          description: Mã sản phẩm không hợp lệ
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/stories:
    get:
      tags:
      - Công khai
      summary: Danh sách câu chuyện
      description: 'Chỉ trả các bài đã đăng. Bản nháp không bao giờ xuất hiện ở đây.


        **Quyền truy cập:** Công khai'
      responses:
        '200':
          description: Danh sách bài đã đăng
          content:
            application/json:
              schema:
                type: object
                properties:
                  stories:
                    type: array
                    items: &id005
                      type: object
                      properties:
                        id: *id002
                        slug: *id001
                        title: *id001
                        excerpt: *id001
                        region: *id001
                        coverUrl: *id001
                        readingMinutes: *id002
                        createdAt: &id004
                          type: string
                          format: date-time
  /api/stories/{slug}:
    get:
      tags:
      - Công khai
      summary: Chi tiết câu chuyện
      description: 'Chi tiết một bài đã đăng, kèm bài liên quan và sản phẩm cùng vùng.


        **Quyền truy cập:** Công khai'
      parameters:
      - name: slug
        in: path
        required: true
        description: Đường dẫn bài viết (chữ thường, số, dấu gạch ngang)
        schema: *id001
      responses:
        '200':
          description: Chi tiết bài viết
          content:
            application/json:
              schema:
                type: object
                properties:
                  story:
                    type: object
                    properties:
                      id: *id002
                      slug: *id001
                      title: *id001
                      excerpt: *id001
                      content: *id001
                      region: *id001
                      coverUrl: *id001
                      readingMinutes: *id002
                      createdAt: *id004
                      updatedAt: *id004
                  related:
                    type: array
                    items: *id005
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *id002
                        name: *id001
                        imageUrl: *id001
                        region: *id001
                        minPrice: *id002
        '404':
          description: Không tìm thấy bài viết
          content:
            application/json:
              schema: *id003
  /api/chat:
    post:
      tags:
      - Công khai
      summary: Chatbot tư vấn sản phẩm
      description: 'Chatbot (Google Gemini) gợi ý sản phẩm. Khóa API chỉ nằm ở máy chủ. Giới hạn 12 câu hỏi / 10
        phút mỗi địa chỉ IP. Trả 503 nếu chưa cấu hình `GEMINI_API_KEY`.


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      text: *id001
                    required:
                    - role
                    - text
              required:
              - messages
            example:
              messages:
              - role: user
                text: Gợi ý cho mình cà phê dưới 150k
      responses:
        '200':
          description: Câu trả lời + sản phẩm gợi ý
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: *id001
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *id002
                        name: *id001
                        region: *id001
                        category: *id001
                        image_url: *id001
                        minPrice: *id002
        '400':
          description: Chưa nhập câu hỏi / JSON sai
          content:
            application/json:
              schema: *id003
        '429':
          description: Hỏi quá nhanh hoặc hết lượt trong ngày
          content:
            application/json:
              schema: *id003
        '502':
          description: Trợ lý tạm thời chưa trả lời được
          content:
            application/json:
              schema: *id003
        '503':
          description: Chưa bật chatbot (thiếu GEMINI_API_KEY)
          content:
            application/json:
              schema: *id003
        '504':
          description: Trợ lý trả lời quá lâu
          content:
            application/json:
              schema: *id003
  /api/auth/me:
    get:
      tags:
      - Xác thực
      summary: Ai đang đăng nhập? (chưa đăng nhập)
      description: 'Trả thông tin người đang đăng nhập; vai trò luôn đọc lại từ database. Chưa đăng nhập thì `user`
        là `null` (không phải lỗi).


        **Quyền truy cập:** Công khai'
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: *id002
                      name: *id001
                      role:
                        $ref: '#/components/schemas/Role'
                    nullable: true
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/login:
    post:
      tags:
      - Xác thực
      summary: Đăng nhập
      description: 'Đăng nhập bằng email + mật khẩu. Thành công thì máy chủ đặt cookie `session_token` (httpOnly).
        Sai 5 lần liên tiếp sẽ khóa tài khoản 15 phút (mã 423). `remember = true` giữ đăng nhập 30 ngày.


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                password:
                  type: string
                  description: Tối đa 200 ký tự
                remember: &id006
                  type: boolean
              required:
              - email
              - password
            example:
              email: khacha@gmail.com
              password: '123456'
              remember: false
      responses:
        '200':
          description: Đăng nhập thành công (kèm cookie session_token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id006
                  user:
                    type: object
                    properties:
                      id: *id002
                      name: *id001
                      role:
                        $ref: '#/components/schemas/Role'
        '400':
          description: Thiếu hoặc sai kiểu email / mật khẩu, hoặc JSON hỏng
          content:
            application/json:
              schema: *id003
        '401':
          description: Sai email hoặc mật khẩu (kèm số lần thử còn lại)
          content:
            application/json:
              schema: *id003
        '403':
          description: Tài khoản chưa xác thực email
          content:
            application/json:
              schema: *id003
        '423':
          description: Tài khoản đang bị khóa tạm thời
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/send-otp:
    post:
      tags:
      - Xác thực
      summary: 'Đăng ký bước 1: gửi mã OTP'
      description: 'Tạo tài khoản chờ xác thực và gửi mã OTP 6 số qua email (sống 3 phút). Gọi lại API này để "gửi
        lại mã" (đợi 60 giây giữa 2 lần). **Cần cấu hình Gmail trong .env** nên không có trong bộ test tự động.


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                full_name:
                  type: string
                  description: 2–100 ký tự
                password:
                  type: string
                  description: 6–72 ký tự
              required:
              - email
              - full_name
              - password
            example:
              email: ten-ban@gmail.com
              full_name: Nguyễn Văn A
              password: '123456'
      responses:
        '200':
          description: Đã gửi mã OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id006
                  expiresInSeconds: *id002
        '400':
          description: Email / họ tên / mật khẩu không hợp lệ
          content:
            application/json:
              schema: *id003
        '409':
          description: Email đã được đăng ký
          content:
            application/json:
              schema: *id003
        '429':
          description: Gửi lại quá nhanh (chờ 60 giây)
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/verify-otp:
    post:
      tags:
      - Xác thực
      summary: 'Đăng ký bước 2: xác thực OTP'
      description: 'Nhập mã OTP để kích hoạt tài khoản. Nhập sai 5 lần thì mã bị hủy (mã 429), phải gửi lại mã mới.


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                otp:
                  type: string
                  description: 6 chữ số
              required:
              - email
              - otp
            example:
              email: ten-ban@gmail.com
              otp: '123456'
      responses:
        '200':
          description: Kích hoạt thành công
          content:
            application/json:
              schema: &id007
                type: object
                properties:
                  ok: *id006
        '400':
          description: OTP sai / hết hạn / không đúng định dạng
          content:
            application/json:
              schema: *id003
        '404':
          description: Không có yêu cầu đăng ký cho email này
          content:
            application/json:
              schema: *id003
        '429':
          description: Nhập sai quá 5 lần, mã đã bị hủy
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/forgot-password:
    post:
      tags:
      - Xác thực
      summary: 'Quên mật khẩu bước 1: gửi mã OTP'
      description: 'Gửi mã OTP đặt lại mật khẩu. Luôn trả `ok` dù email có tồn tại hay không (để không lộ email
        nào đã đăng ký). **Cần cấu hình Gmail.**


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
              required:
              - email
            example:
              email: khacha@gmail.com
      responses:
        '200':
          description: Đã xử lý (không tiết lộ email có tồn tại)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id006
                  expiresInSeconds: *id002
        '400':
          description: Email không hợp lệ
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/reset-password:
    post:
      tags:
      - Xác thực
      summary: 'Quên mật khẩu bước 2: đặt mật khẩu mới'
      description: 'Dùng mã OTP để đặt mật khẩu mới (đồng thời mở khóa tài khoản). Nhập sai OTP 5 lần thì mã bị
        hủy.


        **Quyền truy cập:** Công khai'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                otp:
                  type: string
                  description: 6 chữ số
                password:
                  type: string
                  description: 6–72 ký tự
              required:
              - email
              - otp
              - password
            example:
              email: khacha@gmail.com
              otp: '123456'
              password: matkhaumoi
      responses:
        '200':
          description: Đã đổi mật khẩu
          content:
            application/json:
              schema: *id007
        '400':
          description: Thiếu thông tin / OTP sai hoặc hết hạn / mật khẩu không hợp lệ
          content:
            application/json:
              schema: *id003
        '429':
          description: Nhập sai quá 5 lần
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/cart:
    get:
      tags:
      - Giỏ hàng
      summary: Xem giỏ hàng
      description: 'Giỏ hàng của người đang đăng nhập.


        **Quyền truy cập:** Cần đăng nhập (mọi vai trò)'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Giỏ hàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId: *id002
                        variantId: *id002
                        productId: *id002
                        name: *id001
                        image_url: *id001
                        region: *id001
                        variantName: *id001
                        price: *id008
                        stock: *id002
                        quantity: *id002
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
    post:
      tags:
      - Giỏ hàng
      summary: Thêm vào giỏ
      description: 'Thêm sản phẩm vào giỏ. Đã có thì cộng dồn số lượng (tối đa 999). Số lượng phải là số nguyên
        1–999; sản phẩm phải tồn tại, đang bán và còn hàng.


        **Quyền truy cập:** Cần đăng nhập (mọi vai trò)'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variantId: *id002
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 999
              required:
              - variantId
              - quantity
            example:
              variantId: 1
              quantity: 2
      responses:
        '200':
          description: Đã thêm
          content:
            application/json:
              schema: *id007
        '400':
          description: Mã sản phẩm / số lượng không hợp lệ
          content:
            application/json:
              schema: *id003
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema: *id003
        '404':
          description: Sản phẩm không tồn tại hoặc đã ngừng bán
          content:
            application/json:
              schema: *id003
        '409':
          description: Sản phẩm đã hết hàng
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
    put:
      tags:
      - Giỏ hàng
      summary: Đổi số lượng trong giỏ
      description: 'Đặt số lượng CHÍNH XÁC cho một quy cách đang có trong giỏ (nút +/- ở trang giỏ hàng).


        **Quyền truy cập:** Cần đăng nhập (mọi vai trò)'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variantId: *id002
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 999
              required:
              - variantId
              - quantity
            example:
              variantId: 1
              quantity: 3
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: *id007
        '400':
          description: Mã / số lượng không hợp lệ
          content:
            application/json:
              schema: *id003
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema: *id003
        '404':
          description: Sản phẩm không có trong giỏ
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
    delete:
      tags:
      - Giỏ hàng
      summary: Xóa khỏi giỏ
      description: 'Xóa một quy cách khỏi giỏ hàng.


        **Quyền truy cập:** Cần đăng nhập (mọi vai trò)'
      security:
