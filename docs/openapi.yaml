          description: Không tìm thấy tài khoản
          content:
            application/json:
              schema: *id003
        '409':
          description: Tự đổi quyền chính mình / đã có vai trò đó
          content:
            application/json:
              schema: *id003
        '500':
          description: Lỗi máy chủ (thông báo chung, không lộ chi tiết kỹ thuật)
          content:
            application/json:
              schema: *id003
  /api/auth/logout:
    post:
      tags:
      - Xác thực
      summary: Đăng xuất
      description: 'Xóa cookie đăng nhập.


        **Quyền truy cập:** Công khai'
      responses:
        '200':
          description: Đã đăng xuất
          content:
            application/json:
              schema: *id007
